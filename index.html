<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HE-MAN | Most Powerful Meme Token on BNB Chain</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
    }
    h1 {
      color: #ffd700;
    }
    .buy-btn {
      display: inline-block;
      background-color: #ffd700;
      color: #000;
      font-weight: bold;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      margin: 20px 0;
      transition: 0.3s;
    }
    .buy-btn:hover {
      background-color: #ffae00;
    }
    .ca-box {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 15px;
    }
    button.copy-btn {
      background: #ffd700;
      border: none;
      color: #000;
      padding: 8px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚔️ $HEMAN TOKEN ⚡</h1>
    <p>By the power of Grayskull! The most powerful meme token on BNB Chain!</p>
    
    <a href="https://four.meme/token/0x2461c9f3c1369ac4aa5c3805a5419a6d91ceffff" target="_blank" class="buy-btn">BUY ON FOUR.MEME 🚀</a>

    <div class="ca-box">
      <p style="margin-0; color: #bbb;">Contract Address (CA):</p>
      <code id="ca">0x2461c9f3c1369ac4aa5c3805a5419a6d91ceffff</code><br>
      <button class="copy-btn" onclick="copyCA()">Copy CA</button>
    </div>
  </div>

  <script>
    function copyCA() {
      const caText = document.getElementById("ca").innerText;
      navigator.clipboard.writeText(caText);
      alert("CA kopyalandı!");
    }
  </script>

</body>
</html>
